name: CI

on:
  push:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/thormie-harshey/gitops-pipeline-app

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-push:
    name: Build and push image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  update-config:
    name: Update staging tag in config repo
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out config repo
        uses: actions/checkout@v4
        with:
          repository: Thormie-Harshey/gitops-pipeline-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Set new image tag in staging overlay
        working-directory: overlays/staging
        run: kustomize edit set image ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/staging/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Tag already set, nothing to commit"
            exit 0
          fi
          git commit -m "staging: deploy gitops-pipeline-app@${GITHUB_SHA::7}" \
            -m "Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
